# 乌东文旅全套服务编排
# app 下 4 个服务：
#   midway = app/cool-admin-midway（管理端后端 Cool Admin）   API_PORT   默认 8888
#   api    = app/wu_dong_midway（C 端业务后端，连 wudong 库） WUDONG_API_PORT 默认 8002
#   admin  = app/cool_admin_vue（管理端前端）                 ADMIN_PORT  默认 9000
#   web    = app/wu_dong_vue（C 端前端）                     WEB_PORT    默认 5173
name: wudong

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --group_concat_max_len=102400
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cool}
    volumes:
      - ./data/mysql:/var/lib/mysql
      # 首次启动自动建 wudong 库与 41 张表；若 ./data/mysql 已有数据则忽略，需手动导入 scripts/sql/wudong_schema.sql
      - ../scripts/sql/wudong_schema.sql:/docker-entrypoint-initdb.d/10-wudong_schema.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/redis:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # C 端业务后端（纯 Midway v3 + TypeORM，连 wudong 库）
  api:
    build:
      context: ../app/wu_dong_midway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      KOA_PORT: 8001
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: wudong
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${WUDONG_API_PORT:-8002}:8001"

  # 管理端后端（Cool Admin，连 cool 库）
  midway:
    build:
      context: ../app/cool-admin-midway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      KOA_PORT: 8888
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cool}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${API_PORT:-8888}:8888"

  # 管理端前端
  admin:
    build:
      context: ../app/cool_admin_vue
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - midway
    ports:
      - "${ADMIN_PORT:-9000}:80"

  # C 端前端（开发模式）
  web:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ../app/wu_dong_vue:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${WEB_PORT:-3333}:5173"

volumes:
  web_node_modules:
